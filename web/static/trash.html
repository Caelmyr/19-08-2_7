<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回收站 - CoEdit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #333;
    min-height: 100vh;
  }
  .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  h1 { font-size: 28px; color: #1a1a2e; }
  .subtitle { color: #666; margin-bottom: 32px; }

  .card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1a1a2e;
  }
  .card-meta {
    font-size: 13px;
    color: #999;
    line-height: 1.8;
  }
  .card-meta .countdown { color: #e67e22; }
  .card-meta .countdown.urgent { color: #e74c3c; font-weight: 600; }
  .card-actions { margin-top: 16px; display: flex; gap: 8px; }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-primary { background: #4361ee; color: white; }
  .btn-primary:hover { background: #3a56d4; }
  .btn-secondary { background: #e8ecf1; color: #333; }
  .btn-secondary:hover { background: #d8dde3; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-danger:hover { background: #c0392b; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .empty-state-icon { font-size: 48px; margin-bottom: 16px; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>🗑️ 回收站</h1>
    <a href="/" class="btn btn-secondary">← 返回文档列表</a>
  </div>
  <p class="subtitle">回收站中的文档会在保留期到期后自动彻底删除；恢复后内容与历史版本完整保留</p>

  <div id="trashList"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let trashDocs = [];

async function loadTrash() {
  const res = await fetch('/api/trash');
  trashDocs = await res.json();
  render();
}

function render() {
  const list = document.getElementById('trashList');

  if (!trashDocs || trashDocs.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🗑️</div>
        <p>回收站是空的</p>
      </div>`;
    return;
  }

  list.innerHTML = trashDocs.map(doc => {
    const deletedAt = doc.deleted_at ? new Date(doc.deleted_at) : null;
    const expiresAt = doc.expires_at ? new Date(doc.expires_at) : null;
    const countdown = formatCountdown(expiresAt);
    const urgent = expiresAt && (expiresAt - Date.now()) < 24 * 3600 * 1000;
    return `
    <div class="card">
      <div class="card-title">${escapeHtml(doc.title)}</div>
      <div class="card-meta">
        删除时间: ${deletedAt ? deletedAt.toLocaleString('zh-CN') : '-'}<br>
        自动清理: ${countdown
          ? `<span class="countdown${urgent ? ' urgent' : ''}">${countdown}</span>（${expiresAt.toLocaleString('zh-CN')}）`
          : '-'}
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="restoreDoc('${doc.id}')">↩️ 恢复</button>
        <button class="btn btn-danger" onclick="purgeDoc('${doc.id}')">彻底删除</button>
      </div>
    </div>`;
  }).join('');
}

function formatCountdown(expiresAt) {
  if (!expiresAt) return '';
  let ms = expiresAt - Date.now();
  if (ms <= 0) return '即将清理';
  const days = Math.floor(ms / (24 * 3600 * 1000));
  const hours = Math.floor((ms % (24 * 3600 * 1000)) / (3600 * 1000));
  if (days > 0) return `${days} 天 ${hours} 小时后`;
  const minutes = Math.floor((ms % (3600 * 1000)) / (60 * 1000));
  if (hours > 0) return `${hours} 小时 ${minutes} 分钟后`;
  return `${Math.max(minutes, 1)} 分钟后`;
}

async function restoreDoc(id) {
  const res = await fetch(`/api/trash/${id}/restore`, { method: 'POST' });
  if (!res.ok) {
    showToast('恢复失败：' + await res.text());
    return;
  }
  showToast('✅ 文档已恢复，内容和历史版本完整保留');
  loadTrash();
}

async function purgeDoc(id) {
  const doc = trashDocs.find(d => d.id === id);
  const title = doc ? doc.title : '';
  if (!confirm(`确定彻底删除「${title}」吗？\n删除后内容和全部历史版本将无法恢复。`)) return;
  const res = await fetch(`/api/trash/${id}`, { method: 'DELETE' });
  if (!res.ok) {
    showToast('删除失败：' + await res.text());
    return;
  }
  showToast('文档已彻底删除');
  loadTrash();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

loadTrash();
// 每分钟刷新一次倒计时
setInterval(render, 60 * 1000);
</script>
</body>
</html>
